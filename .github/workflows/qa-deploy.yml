name: Deploy to AWS EC2

on:
  push:
    branches:
      - testingaws
  workflow_dispatch:

permissions: read-all

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ✅ Log in to DockerHub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 🚀 Build and Push MongoDB Image (Optional if using a custom image)
    - name: Build and push MongoDB Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./database
        file: ./database/Dockerfile
        push: true
        tags: darkjus/mongo-db:latest

    # 🚀 Deploy MongoDB on EC2
    - name: Deploy MongoDB on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DNS_MONGO_DB }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo docker stop mongo-db || true
          sudo docker rm mongo-db || true
          sudo docker pull darkjus/mongo-db:latest
          sudo docker run -d --name mongo-db \
            --restart always \
            -p 27017:27017 \
            -e "MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_USER }}" \
            -e "MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_PASSWORD }}" \
            darkjus/mongo-db

    # 🚀 Build and Push Auth Service
    - name: Build and push Auth Service Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./auth
        file: ./auth/Dockerfile
        push: true
        tags: darkjus/auth-service:latest

    # 🚀 Deploy Auth Service on EC2
    - name: Deploy Auth Service on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DNS_AUTH_SERVICE }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo docker stop auth-service || true
          sudo docker rm auth-service || true
          sudo docker pull darkjus/auth-service:latest
          sudo docker run -d --name auth-service \
            --restart always \
            -p 3000:3000 \
            -e "JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            darkjus/auth-service

    # 🚀 Build and Push Product Service
    - name: Build and push Product Service Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./product
        file: ./product/Dockerfile
        push: true
        tags: darkjus/product-service:latest

    # 🚀 Deploy Product Service on EC2
    - name: Deploy Product Service on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DNS_PRODUCT_SERVICE }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo docker stop product-service || true
          sudo docker rm product-service || true
          sudo docker pull darkjus/product-service:latest
          sudo docker run -d --name product-service \
            --restart always \
            -p 4000:4000 \
            -e "MONGO_URI=mongodb://${{ secrets.MONGO_USER }}:${{ secrets.MONGO_PASSWORD }}@${{ secrets.DNS_MONGO_DB }}:27017/products_db?authSource=admin" \
            -e "MONGO_USER=${{ secrets.MONGO_USER }}" \
            -e "MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}" \
            -e "MONGO_DB_NAME=products_db" \
            darkjus/product-service

    # 🚀 Build and Push Order Service
    - name: Build and push Order Service Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./order
        file: ./order/Dockerfile
        push: true
        tags: darkjus/order-service:latest

    # 🚀 Deploy Order Service on EC2
    - name: Deploy Order Service on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DNS_ORDER_SERVICE }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo docker stop order-service || true
          sudo docker rm order-service || true
          sudo docker pull darkjus/order-service:latest
          sudo docker run -d --name order-service \
            --restart always \
            -p 5000:5000 \
            -e "AUTH_SERVICE_URL=http://${{ secrets.DNS_AUTH_SERVICE }}:3000" \
            -e "PRODUCT_SERVICE_URL=http://${{ secrets.DNS_PRODUCT_SERVICE }}:4000" \
            -e "MONGO_URI=mongodb://${{ secrets.MONGO_USER }}:${{ secrets.MONGO_PASSWORD }}@${{ secrets.DNS_MONGO_DB }}:27017/orders_db?authSource=admin" \
            -e "MONGO_USER=${{ secrets.MONGO_USER }}" \
            -e "MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}" \
            -e "MONGO_DB_NAME=orders_db" \
            darkjus/order-service
