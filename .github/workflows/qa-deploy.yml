name: Deploy to AWS EC2

on:
  push:
    branches:
      - testingaws  # ✅ Runs only when code is pushed to `testingaws`
  workflow_dispatch:  # ✅ Allows manual execution from GitHub Actions UI

permissions: read-all  # ✅ Required to read repo data

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ✅ Log in to DockerHub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 🚀 Build and Push MongoDB Image
    - name: Build and push MongoDB Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./mongodb
        file: ./mongodb/Dockerfile
        push: true
        tags: darkjus/mongo-db:latest

    # 🚀 Deploy MongoDB on EC2
    - name: Deploy MongoDB on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DNS_MONGO_DB }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo docker stop mongo-db || true
          sudo docker rm mongo-db || true
          sudo docker pull darkjus/mongo-db:latest
          sudo docker run -d --name mongo-db \
            --restart always \
            -p 27017:27017 \
            -e "MONGO_INITDB_ROOT_USERNAME=${{ secrets.MONGO_USER }}" \
            -e "MONGO_INITDB_ROOT_PASSWORD=${{ secrets.MONGO_PASSWORD }}" \
            darkjus/mongo-db

    # 🚀 Build and Deploy Other Services (Auth, Product, Order)
    - name: Build and deploy services
      run: |
        for service in auth product order; do
          docker build -t darkjus/${service}-service:latest ./$service
          docker push darkjus/${service}-service:latest
        done

    - name: Deploy services to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DNS_AUTH_SERVICE }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          for service in auth product order; do
            sudo docker stop ${service}-service || true
            sudo docker rm ${service}-service || true
            sudo docker pull darkjus/${service}-service:latest
            sudo docker run -d --name ${service}-service \
              --restart always \
              -p ${{ env["${service^^}_PORT"] }}:${{ env["${service^^}_PORT"] }} \
              --env-file ./${service}/.env \
              darkjus/${service}-service
          done
