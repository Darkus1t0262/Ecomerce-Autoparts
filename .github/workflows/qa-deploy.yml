name: Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Runs when code is pushed to the `main` branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 🚀 Build and Push Auth Service
    - name: Build and push Auth Service Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./auth
        file: ./auth/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/auth-service:latest

    # 🚀 Deploy Auth Service on EC2
    - name: Deploy Auth Service on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DNS_AUTH_SERVICE }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo docker stop auth-service || echo "No existing process found"
          sudo docker rm auth-service || echo "No existing process found"
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/auth-service:latest
          sudo docker run -d -p 3000:3000 --name auth-service \
            -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
            ${{ secrets.DOCKER_USERNAME }}/auth-service

    # 🚀 Build and Push Product Service
    - name: Build and push Product Service Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./product
        file: ./product/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/product-service:latest

    # 🚀 Deploy Product Service on EC2
    - name: Deploy Product Service on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DNS_PRODUCT_SERVICE }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo docker stop product-service || echo "No existing process found"
          sudo docker rm product-service || echo "No existing process found"
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/product-service:latest
          sudo docker run -d -p 4000:4000 --name product-service \
            -e MONGO_URI=${{ secrets.MONGO_URI }} \
            -e MONGO_USER=${{ secrets.MONGO_USER }} \
            -e MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }} \
            -e MONGO_DB_NAME=${{ secrets.MONGO_DB_NAME }} \
            ${{ secrets.DOCKER_USERNAME }}/product-service

    # 🚀 Build and Push Order Service
    - name: Build and push Order Service Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./order
        file: ./order/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/order-service:latest

    # 🚀 Deploy Order Service on EC2
    - name: Deploy Order Service on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DNS_ORDER_SERVICE }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo docker stop order-service || echo "No existing process found"
          sudo docker rm order-service || echo "No existing process found"
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/order-service:latest
          sudo docker run -d -p 5000:5000 --name order-service \
            -e AUTH_SERVICE_URL=http://${{ secrets.DNS_AUTH_SERVICE }}:3000 \
            -e PRODUCT_SERVICE_URL=http://${{ secrets.DNS_PRODUCT_SERVICE }}:4000 \
            -e MONGO_URI=${{ secrets.MONGO_URI }} \
            -e MONGO_USER=${{ secrets.MONGO_USER }} \
            -e MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }} \
            -e MONGO_DB_NAME=${{ secrets.MONGO_DB_NAME }} \
            ${{ secrets.DOCKER_USERNAME }}/order-service
