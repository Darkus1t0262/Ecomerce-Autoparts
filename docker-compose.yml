version: '3.8'

services:
  auth-service:
    image: darkjus/auth-service:latest
    build: ./auth
    restart: always
    networks:
      - backend
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET}

  product-service:
    image: darkjus/product-service:latest
    build: ./product
    restart: always
    depends_on:
      mongo-db:
        condition: service_healthy
    networks:
      - backend
    ports:
      - "4000:4000"
    environment:
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo-db:27017/products_db?authSource=admin
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_DB_NAME=products_db

  order-service:
    image: darkjus/order-service:latest
    build: ./order
    restart: always
    depends_on:
      mongo-db:
        condition: service_healthy
    networks:
      - backend
    ports:
      - "5000:5000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:3000
      - PRODUCT_SERVICE_URL=http://product-service:4000
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo-db:27017/orders_db?authSource=admin
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_DB_NAME=orders_db

  mongo-db:
    image: mongo:latest
    container_name: mongo-db
    restart: always
    networks:
      - backend
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 5
      start_period: 10s

networks:
  backend:
    driver: bridge

volumes:
  mongo-data:
