version: '3.8'
services:
  auth-service:
    image: your-dockerhub-username/auth-service:latest
    restart: always
    networks:
      - backend
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=mysecret

  product-service:
    image: your-dockerhub-username/product-service:latest
    restart: always
    networks:
      - backend
    ports:
      - "4000:4000"

  order-service:
    image: your-dockerhub-username/order-service:latest
    restart: always
    networks:
      - backend
    ports:
      - "5000:5000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:3000
      - PRODUCT_SERVICE_URL=http://product-service:4000

networks:
  backend:
    driver: bridge
